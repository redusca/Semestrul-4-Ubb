<!DOCTYPE html>
<html>
<head>
    <title>Problema 6: Magazin</title>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="script_jquery.js"></script>
    <!--
      <script src="script_javascript.js"></script>-->
</head>
<body>
<h1>Filtrare produse</h1>

<label for="platform">Platform:</label>
<select id="platform">
    <option value="">All</option>
</select>

<label for="genre">Genre:</label>
<select id="genre">
    <option value="">All</option>
</select>

<label for="publisher">Publisher:</label>
<select id="publisher">
    <option value="">All</option>
</select>

<label for="stock">Stock:</label>
<select id="stock">
    <option value="">All</option>
    <option value="0">Out of Stock</option>
    <option value="1">In Stock</option>
</select>

<label for="price">Price:</label>
<select id="price">
    <option value="">All</option>
    <option value="0"> less than 10$</option>
    <option value="1"> 10$-20$</option>
    <option value="2"> 20$-40$</option>
    <option value="3"> more than 40$</option>
</select>

<button id="filterButton">Filtreaza</button>

<div id="results">
</div>
</body>
</html>
