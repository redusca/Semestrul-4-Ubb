<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Problmea 3: Update data form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script_jquerry.js"></script>
    <!--
    <script src="script_javascript.js"></script>-->

</head>
<body>
    <h1>VideoGames Management</h1>
    <div class="table-container">
    <table id="table"> </table>
    </div>
    <form id="formular">
        <label for="id">ID:</label>
        <input type="text" id="id" disabled>
        <label for="title">Title:</label>
        <input type="text" id="title">
        <label for="platform">Platform:</label>
        <input type="text" id="platform" >
        <label for="genre">Genre:</label>
        <input type="text" id="genre">
        <label for="publisher">Publisher:</label>
        <input type="text" id="publisher">
        <label for="releaseDate">Release Date:</label>
        <input type="date" id="release Date">
        <label for="stock">Stock:</label>
        <input type="number" id="stock" min="0">
        <label for="price">Price:</label>
        <input type="number" id="price" min="0">
        <button type="button" id="saveButton" disabled>Save</button>
    </form>

</body>
</html>
